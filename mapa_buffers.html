  h1 { margin:0 0 10px; font-size:16px; font-weight:600; }

  .ctl > label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#666;

  #btnFiltro { padding:6px 12px; font-size:13px; cursor:pointer; background:#fff;
               border:1px solid #c9c9cf; border-radius:6px; font-family:inherit; }
  #btnFiltro:hover { border-color:var(--magenta); }

  #shiptos { display:block; }
  #shiptos label { font-size:13px; color:#222; display:flex; align-items:center; gap:6px;
                   cursor:pointer; padding:3px 0; }
  #shiptos label.oculto { display:none; }
  #shiptos .st-cod { font-variant-numeric:tabular-nums; font-weight:600; }

  #btnPanel { position:fixed; z-index:1200; right:14px; bottom:14px;
              padding:8px 14px; font-size:13px; cursor:pointer; background:#fff;

              box-shadow:0 2px 10px rgba(0,0,0,.18); }

  body.solo-mapa #map { height:calc(100vh - 92px); }
  body.solo-mapa #panel { display:none; }

  #resumen { font-size:13px; color:#555; margin:0 0 8px; }

  th,td { border:1px solid #e3e3e6; padding:6px 9px; text-align:left; }

  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .empty { color:#999; font-style:italic; }
  .leaflet-marker-icon.logo { border-radius:50%; background:#fff; border:2px solid #fff;

</header>

</div>

const AXION_KEY  = "AXION";
const MAGENTA    = "#A8337D";
const ROJO       = "#36FF03";
const R_TIERRA   = 6371.0088;

const esAxion = e => e.bandera.toUpperCase() === AXION_KEY;
const rad = d => d * Math.PI / 180;

function haversine(a, b) {
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat/2)**2 +
            Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon/2)**2;
  return 2 * R_TIERRA * Math.asin(Math.sqrt(h));
}

const map = L.map("map");
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 19
}).addTo(map);

function icono(bandera) {
  const url = LOGOS[bandera];
  if (!url) return L.divIcon({
    className: "", iconSize: [14,14], iconAnchor: [7,7],
    html: `<div style="width:14px;height:14px;border-radius:50%;background:#888;border:2px solid #fff"></div>`
  });
  return L.icon({ iconUrl:url, iconSize:[28,28], iconAnchor:[14,14],
                  popupAnchor:[0,-14], className:"logo" });
}

ESTACIONES.forEach(e => {
  e.marker = L.marker([e.lat, e.lon], { icon: icono(e.bandera) })
    .bindPopup(`<b>${e.nombre || "(sin nombre)"}</b><br>SHIP TO ${e.shipto}<br>${e.bandera}`);
  if (esAxion(e)) {
    e.circle = L.circle([e.lat, e.lon], {
      radius: 0, color: MAGENTA, weight: 1, fillColor: MAGENTA, fillOpacity: 0.08
    });
  }
});

// ---------- filtro por SHIP TO ----------
const shiptos = [...new Set(ESTACIONES.map(e => e.shipto))].sort();
const activas = new Set(shiptos);          // SHIP TO activos (visibles)
const cont    = document.getElementById("shiptos");
const checks  = [];
const nombreDe = {};
ESTACIONES.forEach(e => { if (!(e.shipto in nombreDe)) nombreDe[e.shipto] = e.nombre || ""; });

shiptos.forEach(p => {
  const lbl = document.createElement("label");
  const cb  = document.createElement("input");
  cb.type = "checkbox"; cb.checked = true; cb.value = p;
  cb.onchange = () => { cb.checked ? activas.add(p) : activas.delete(p); redibujar(); };
  checks.push(cb);
  const cod = document.createElement("span");
  cod.className = "st-cod"; cod.textContent = p;
  const nom = document.createElement("span");
  nom.className = "st-nom"; nom.textContent = nombreDe[p] ? "· " + nombreDe[p] : "";
  lbl.appendChild(cb);
  lbl.appendChild(cod);
  lbl.appendChild(nom);
  lbl.dataset.busca = (p + " " + (nombreDe[p] || "")).toLowerCase();
  cont.appendChild(lbl);
});

const panelF = document.getElementById("panelFiltro");
document.getElementById("btnFiltro").onclick = e => {
  e.stopPropagation();
  panelF.classList.toggle("abierto");
};
panelF.onclick = e => e.stopPropagation();
document.addEventListener("click", () => panelF.classList.remove("abierto"));

// buscador: oculta las filas que no matchean (no cambia la selección)
document.getElementById("buscaShipto").oninput = ev => {
  const q = ev.target.value.trim().toLowerCase();
  for (const lbl of cont.children)
    lbl.classList.toggle("oculto", q !== "" && !lbl.dataset.busca.includes(q));
};

// Todos / Ninguno: aplican solo a las filas visibles del buscador
function setVisibles(v) {
  checks.forEach(cb => {
    const lbl = cb.parentElement;
    if (lbl.classList.contains("oculto")) return;   // respetar el filtro de búsqueda
    cb.checked = v;
    v ? activas.add(cb.value) : activas.delete(cb.value);
  });
  redibujar();
}
document.getElementById("selTodos").onclick   = () => setVisibles(true);
document.getElementById("selNinguno").onclick = () => setVisibles(false);

// ---------- toggle de tabla ----------
const btnP = document.getElementById("btnPanel");
btnP.onclick = () => {
  const oculto = document.body.classList.toggle("solo-mapa");
  btnP.textContent = oculto ? "Mostrar tabla" : "Ocultar tabla";
  map.invalidateSize();
};

// ---------- geometría de la lente ----------
const lentes = [];
const PASOS  = 24;

function lente(a, b, rKm) {
  const crs = map.options.crs;
  const pa = crs.project(L.latLng(a.lat, a.lon));
  const pb = crs.project(L.latLng(b.lat, b.lon));

  // L.circle escala el radio por 1/cos(lat) al proyectar; replicamos eso
  const R = rKm * 1000 / Math.cos(rad((a.lat + b.lat) / 2));

  const dx = pb.x - pa.x, dy = pb.y - pa.y;
  const d  = Math.hypot(dx, dy);
  if (d >= 2 * R || d === 0) return null;

  const h  = Math.sqrt(R * R - (d / 2) ** 2);
  const mx = pa.x + dx / 2, my = pa.y + dy / 2;
  const ux = -dy / d, uy = dx / d;

  const p1 = { x: mx + ux * h, y: my + uy * h };
  const p2 = { x: mx - ux * h, y: my - uy * h };

  const arco = (c, from, to) => {
    const a0 = Math.atan2(from.y - c.y, from.x - c.x);
    const a1 = Math.atan2(to.y   - c.y, to.x   - c.x);
    let dA = a1 - a0;
    while (dA >  Math.PI) dA -= 2 * Math.PI;
    while (dA < -Math.PI) dA += 2 * Math.PI;
    const pts = [];
    for (let i = 0; i <= PASOS; i++) {
      const t = a0 + dA * (i / PASOS);
      pts.push(crs.unproject(L.point(c.x + R * Math.cos(t), c.y + R * Math.sin(t))));
    }
    return pts;
  };

  return [...arco(pa, p1, p2), ...arco(pb, p2, p1)];
}

// ---------- render ----------
function redibujar() {
  const rKm = parseFloat(document.getElementById("radio").value);
  document.getElementById("radioVal").textContent = rKm.toFixed(1) + " km";
  document.getElementById("cuenta").textContent = `(${activas.size}/${shiptos.length})`;

  ESTACIONES.forEach(e => {
    const vis = activas.has(e.shipto);
    vis ? e.marker.addTo(map) : map.removeLayer(e.marker);
    if (e.circle) {
      e.circle.setRadius(rKm * 1000);
      vis ? e.circle.addTo(map) : map.removeLayer(e.circle);
    }
  });

  const ax = ESTACIONES.filter(e => esAxion(e) && activas.has(e.shipto));
  const pares  = [];
  const chocan = new Set();
  for (let i = 0; i < ax.length; i++)
    for (let j = i + 1; j < ax.length; j++) {
      const d = haversine(ax[i], ax[j]);
      if (d < 2 * rKm) {
        pares.push({ a: ax[i], b: ax[j], d, solape: 2 * rKm - d });
        chocan.add(ax[i]); chocan.add(ax[j]);
      }
    }
  pares.sort((p, q) => p.d - q.d);

  // los buffers quedan siempre magenta
  ax.forEach(e => e.circle.setStyle({
    color: MAGENTA, fillColor: MAGENTA, weight: 1, fillOpacity: 0.08
  }));

  // se pinta solo la intersección de cada par
  lentes.forEach(l => map.removeLayer(l));
  lentes.length = 0;
  for (const p of pares) {
    const pts = lente(p.a, p.b, rKm);
    if (!pts) continue;
    lentes.push(L.polygon(pts, {
      className: "lente",
      color: ROJO, weight: 1.5, fillColor: ROJO, fillOpacity: 0.45
    }).addTo(map));
  }

  document.getElementById("resumen").innerHTML =
    `${ax.length} estaciones ${AXION_KEY} visibles · ` +
    `<b>${chocan.size} con solapamiento</b> · ` +
    `${pares.length} par(es) a ${rKm.toFixed(1)} km de radio.`;

  const tb = document.getElementById("tbody");
  tb.innerHTML = "";
  if (!pares.length) {
    tb.innerHTML = `<tr><td colspan="6" class="empty">Sin superposiciones a este radio.</td></tr>`;
    return;
  }
  for (const p of pares) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${p.a.shipto}</td><td>${p.a.nombre}</td>
                    <td>${p.b.shipto}</td><td>${p.b.nombre}</td>
                    <td class="num">${p.d.toFixed(2)}</td>
                    <td class="num">${p.solape.toFixed(2)}</td>`;
    tr.onclick = () => map.fitBounds(
      L.latLngBounds([[p.a.lat, p.a.lon], [p.b.lat, p.b.lon]]).pad(0.6));
    tb.appendChild(tr);
  }
}

map.fitBounds(L.latLngBounds(ESTACIONES.map(e => [e.lat, e.lon])).pad(0.08));
document.getElementById("radio").oninput = redibujar;
redibujar();
</script>
